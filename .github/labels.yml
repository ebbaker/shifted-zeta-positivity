# Suggested issue labels. GitHub has no native import for this file; create them with
#   python3 -c "import yaml,subprocess;[subprocess.run(['gh','label','create',l['name'],'--color',l['color'],'--description',l['description'],'--force']) for l in yaml.safe_load(open('.github/labels.yml'))]"
# or by hand in Settings → Labels.
- name: verification
  color: "0E8A16"
  description: A human check of a statement, constant or attribution
- name: possible-error
  color: "B60205"
  description: A statement believed to be wrong; needs a specific location and reason
- name: formalization
  color: "1D76DB"
  description: Lean/Mathlib formalization of a blueprint statement
- name: good-first-check
  color: "C2E0C6"
  description: Elementary item; half a day or less; no specialist background
- name: needs-specialist
  color: "5319E7"
  description: Needs a functional analyst or analytic number theorist
- name: repository
  color: "FBCA04"
  description: Needs the certificate code (Part D items)
- name: release
  color: "000000"
  description: Release checklist and DOI bookkeeping
