name: First-slab diagnostics and citation metadata

on:
  push:
    paths:
      - 'papers/weil-positivity/shifted-zeta/first-slab-positivity/verification/scripts/**'
      - '**/CITATION.cff'
      - 'CITATION.cff'
      - 'tools/check_citations.py'
      - 'tools/requirements_metadata.txt'
      - '.github/workflows/check-first-slab.yml'
  pull_request:
    paths:
      - 'papers/weil-positivity/shifted-zeta/first-slab-positivity/verification/scripts/**'
      - '**/CITATION.cff'
      - 'CITATION.cff'
      - 'tools/check_citations.py'
      - 'tools/requirements_metadata.txt'
      - '.github/workflows/check-first-slab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned diagnostic dependencies
        run: python -m pip install -r papers/weil-positivity/shifted-zeta/first-slab-positivity/verification/scripts/requirements_stable_checks.txt
      - name: Run stable numerical checks (not interval certificates)
        run: python papers/weil-positivity/shifted-zeta/first-slab-positivity/verification/scripts/verify_stable_volterra_20260909.py
  citation-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned metadata validation dependencies
        run: python -m pip install -r tools/requirements_metadata.txt
      - name: Obtain the versioned official schema and validate citations
        run: |
          curl --fail --show-error --location --retry 3 --max-time 60 https://citation-file-format.github.io/1.2.0/schema.json --output /tmp/cff-1.2.0-schema.json
          python tools/check_citations.py --schema /tmp/cff-1.2.0-schema.json
